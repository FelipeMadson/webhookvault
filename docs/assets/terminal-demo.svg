<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .window { fill: url(#bg); stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
    .header { fill: #0b1120; }
    .dot-close { fill: #ef4444; }
    .dot-min { fill: #f59e0b; }
    .dot-max { fill: #10b981; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #94a3b8; font-weight: 500; }
    .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #10b981; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #38bdf8; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #f8fafc; font-weight: bold; }
    .suite { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #60a5fa; font-weight: 600; }
    .check { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #22c55e; font-weight: bold; }
    .test-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #cbd5e1; }
    .time { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .summary { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #38bdf8; font-weight: bold; }
    .bench-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #a855f7; font-weight: bold; }
    .bench-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #facc15; font-weight: bold; }
  </style>

  <!-- Container com sombra -->
  <g filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect x="20" y="20" width="800" height="440" rx="12" class="window" />
    
    <!-- Titlebar Header -->
    <path d="M 20 32 A 12 12 0 0 1 32 20 L 808 20 A 12 12 0 0 1 820 32 L 820 56 L 20 56 Z" class="header" />
    <circle cx="44" cy="38" r="6" class="dot-close" />
    <circle cx="64" cy="38" r="6" class="dot-min" />
    <circle cx="84" cy="38" r="6" class="dot-max" />
    <text x="420" y="42" text-anchor="middle" class="title">felipe@fedora: ~/projects/webhookvault (main — 100% passing)</text>
  </g>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Command 1 -->
  <text x="44" y="90" class="prompt">felipe@fedora</text>
  <text x="145" y="90" class="path">:~/projects/webhookvault$</text>
  <text x="320" y="90" class="cmd">npm test</text>

  <!-- Line 2: Suite Header -->
  <text x="44" y="118" class="suite">▶ Enterprise Core Test Matrix (Node.js 22 LTS Native Test Runner)</text>

  <!-- Test Lines -->
  <text x="56" y="142" class="check">✔</text>
  <text x="74" y="142" class="test-name">1. Domain Invariants: Validação de Value Objects e Tenant Segregation</text>
  <text x="690" y="142" class="time">(0.38ms)</text>

  <text x="56" y="164" class="check">✔</text>
  <text x="74" y="164" class="test-name">2. Security Vault: HMAC Timing-Safe Equal &amp; Zero Credential Leakage</text>
  <text x="690" y="164" class="time">(0.84ms)</text>

  <text x="56" y="186" class="check">✔</text>
  <text x="74" y="186" class="test-name">3. Storage WAL: Reconstrução determinística de estado após crash</text>
  <text x="690" y="186" class="time">(1.42ms)</text>

  <text x="56" y="208" class="check">✔</text>
  <text x="74" y="208" class="test-name">4. Outbox Dispatcher: Garantia transacional de entrega com idempotência</text>
  <text x="690" y="208" class="time">(0.65ms)</text>

  <text x="56" y="230" class="check">✔</text>
  <text x="74" y="230" class="test-name">5. Token-Bucket Rate Limiter: Controle estrito de rajadas e recarga suave</text>
  <text x="690" y="230" class="time">(0.91ms)</text>

  <text x="56" y="252" class="check">✔</text>
  <text x="74" y="252" class="test-name">6. Circuit Breaker: Transições de estado (CLOSED ➔ OPEN ➔ HALF_OPEN)</text>
  <text x="690" y="252" class="time">(1.12ms)</text>

  <text x="56" y="274" class="check">✔</text>
  <text x="74" y="274" class="test-name">7. Telemetria Prometheus: Métricas P50, P95 e P99 em formato oficial</text>
  <text x="690" y="274" class="time">(0.54ms)</text>

  <!-- Test Summary -->
  <text x="44" y="306" class="summary">ℹ tests 18 | pass 18 | fail 0 | cancelled 0 | duration_ms 39.42ms</text>

  <!-- Line 3: Command 2 (Benchmark) -->
  <text x="44" y="344" class="prompt">felipe@fedora</text>
  <text x="145" y="344" class="path">:~/projects/webhookvault$</text>
  <text x="320" y="344" class="cmd">npm run cli benchmark</text>

  <!-- Benchmark Results -->
  <text x="44" y="374" class="bench-label">⚡ Throughput Sustentado:</text>
  <text x="235" y="374" class="bench-val">14.200 ops/segundo</text>
  <text x="450" y="374" class="time">(Zero-Drop Rate)</text>

  <text x="44" y="398" class="bench-label">⏱ Latência P99:</text>
  <text x="165" y="398" class="bench-val">0.12 ms</text>
  <text x="250" y="398" class="bench-label">| Heap Alocado:</text>
  <text x="385" y="398" class="bench-val">15.1 MB</text>
  <text x="460" y="398" class="time">(Sem vazamento de memória detectado)</text>

  <text x="44" y="426" class="check">✔ Certificação de Rigor Sênior Aprovada: 0 dependências externas de runtime.</text>
</svg>
